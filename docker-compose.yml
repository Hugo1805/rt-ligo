services:
  postgres:
    image: postgres:16-alpine
    container_name: cashin-postgres
    environment:
      POSTGRES_USER: cashin
      POSTGRES_PASSWORD: cashin
      POSTGRES_DB: cashin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashin -d cashin"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: cashin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
